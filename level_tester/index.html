<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level Tester</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }

      /* Loading Screen */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading-screen h1 {
        color: #e0e0e0;
        font-size: 2rem;
        font-weight: 300;
        margin-bottom: 2rem;
      }
      #loading-progress-container {
        width: 300px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      #loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
        border-radius: 2px;
        transition: width 0.3s ease-out;
      }
      #loading-status {
        color: #888;
        font-size: 0.875rem;
        margin-top: 1rem;
        min-height: 1.25rem;
      }
      #loading-error {
        color: #ff6b6b;
        font-size: 0.875rem;
        margin-top: 1rem;
        max-width: 400px;
        text-align: center;
        display: none;
      }
      #loading-error.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <h1>Level Tester</h1>
      <div id="loading-progress-container">
        <div id="loading-progress-bar"></div>
      </div>
      <div id="loading-status">Initializing...</div>
      <div id="loading-error"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
