[project]
name = "trivesta-level"
version = "0.1.1"
description = "Blender extension for Three.js level design"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# bl_info must come before imports in Blender extensions
"blender_extension/__init__.py" = ["E402"]

[tool.pytest.ini_options]
# Unit tests only - E2E tests require Blender runtime
testpaths = ["tests"]
# Exclude E2E tests (run via: uv run python tests/e2e/find_blender.py)
# Exclude dependencies (addon_testing is a reference, not our tests)
addopts = "--ignore=tests/e2e --ignore=dependencies"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true

[tool.ty]
# Blender modules (bpy, mathutils, etc.) are only available inside Blender runtime
# Ignore unresolved imports for these modules
[tool.ty.rules]
unresolved-import = "ignore"
# Blender PropertyGroup uses annotation syntax (name: StringProperty(...))
# which is valid Blender but not valid Python type annotation syntax
invalid-type-form = "ignore"
